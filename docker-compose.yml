version: '3.8'

services:
  backend:
    build: ./backend
    container_name: music_stream_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_TYPE=sqlite
      - FRONTEND_URL=http://localhost
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: music_stream_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
